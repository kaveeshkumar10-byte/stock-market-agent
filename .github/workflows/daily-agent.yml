
name: Intraday GenAI Paper Trading Agent

on:
  schedule:
    # Every 15 minutes, Monday to Friday.
    # UTC 03:00-09:45 = IST 08:30-15:15.
    # Python checks actual Indian market hours.
    - cron: "*/15 3-9 * * 1-5"

  workflow_dispatch:

concurrency:
  group: intraday-paper-trading
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy plotly yfinance requests supabase

      - name: Run intraday GenAI agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py
