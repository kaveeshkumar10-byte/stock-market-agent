name: Intraday GenAI Paper Trading Agent

on:
  # Full technical scan of the complete CSV universe once every hour.
  # UTC 04:00-09:00 = IST 09:30-14:30, Monday to Friday.
  schedule:
    - cron: "0 4-9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: intraday-full-nse-scan
  cancel-in-progress: false

jobs:
  run-full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy plotly yfinance requests supabase pandas-market-calendars==5.3.2

      - name: Run full NSE GenAI paper-trading scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py
